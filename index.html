<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mes réseaux</title>


    <!-- ========================================== -->
    <!-- PRÉCHARGEMENT PHOTO PRINCIPALE             -->
    <!-- ========================================== -->

    <link
        rel="preload"
        as="image"
        href="images/photo_profil.webp"
        type="image/webp"
        fetchpriority="high"
    >


    <!-- ========================================== -->
    <!-- PRÉCHARGEMENT CSS                          -->
    <!-- ========================================== -->

    <link
        rel="preload"
        href="style.css"
        as="style"
    >


    <!-- ========================================== -->
    <!-- CSS CRITIQUE                               -->
    <!-- ========================================== -->

    <style>

        * {
            box-sizing: border-box;
        }


        html {
            width: 100%;
            height: 100%;

            margin: 0;

            background-color: black;

            overflow: hidden;
        }


        body {
            margin: 0;

            width: 100%;

            height: 100vh;
            height: 100dvh;

            background-color: black;

            font-family: Arial, sans-serif;

            color: white;

            position: relative;

            overflow: hidden;

            overscroll-behavior: none;

            isolation: isolate;
        }


        body::before {
            content: "";

            position: fixed;

            top: -80px;
            right: -80px;
            bottom: -80px;
            left: -80px;

            background-image:
                url("images/photo_profil.webp");

            background-position:
                center;

            background-size:
                cover;

            background-repeat:
                no-repeat;

            filter:
                blur(70px)
                saturate(1.25);

            opacity:
                0.75;

            transform:
                scale(1.1);

            z-index:
                0;

            pointer-events:
                none;
        }


        body::after {
            content: "";

            position: fixed;

            inset: 0;

            background: linear-gradient(
                to right,

                rgba(0, 0, 0, 0.95) 0%,

                rgba(0, 0, 0, 0.55) 18%,

                rgba(0, 0, 0, 0.05) 36%,

                transparent 44%,

                transparent 56%,

                rgba(0, 0, 0, 0.05) 64%,

                rgba(0, 0, 0, 0.55) 82%,

                rgba(0, 0, 0, 0.95) 100%
            );

            z-index:
                0;

            pointer-events:
                none;
        }


        .page {
            position: relative;

            z-index: 1;

            width: 100%;
            max-width: 500px;

            height: 100%;

            margin: auto;

            background-color:
                transparent;

            overflow:
                hidden;
        }


        .hero {
            position: relative;

            width: 100%;
            height: 100%;

            overflow:
                hidden;

            background-color:
                black;
        }


        .photo-fond {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit:
                cover;

            z-index:
                0;
        }


        .degrade {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            background: linear-gradient(
                to bottom,

                transparent 58%,

                rgba(0, 0, 0, 0.42) 68%,

                rgba(0, 0, 0, 0.60) 78%,

                rgba(0, 0, 0, 0.65) 90%,

                rgba(0, 0, 0, 0.85) 100%
            );

            z-index:
                1;

            pointer-events:
                none;
        }


        .profil {
            position: absolute;

            bottom: 30px;

            width: 100%;

            text-align:
                center;

            padding:
                20px;

            z-index:
                2;
        }


        h1 {
            font-size:
                42px;

            margin:
                0;

            font-weight:
                bold;
        }


        .pseudo {
            font-size:
                25px;

            color:
                #cccccc;

            margin:
                10px 0;
        }


        .followers {
            display:
                inline-block;

            padding:
                8px 15px;

            border-radius:
                20px;

            font-size:
                16px;

            margin-bottom:
                25px;
        }


        .reseaux {
            display:
                flex;

            justify-content:
                center;

            flex-wrap:
                wrap;

            gap:
                18px;
        }


        .reseaux a {
            text-decoration:
                none;
        }


        .icone {
            width:
                65px;

            height:
                65px;

            border-radius:
                50%;

            background-color:
                white;

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            border:
                2px solid #444;

            overflow:
                hidden;
        }


        .icone img {
            width:
                50px;

            height:
                50px;

            object-fit:
                contain;
        }


        .bouton-reseau {
            padding:
                0;

            cursor:
                pointer;
        }

    </style>


    <!-- ========================================== -->
    <!-- FEUILLE CSS COMPLÈTE                       -->
    <!-- ========================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="page">

        <section class="hero">


            <!-- ========================================== -->
            <!-- PHOTO PRINCIPALE                           -->
            <!-- ========================================== -->

            <img
                src="images/photo_profil.webp"
                alt="Photo de profil"
                class="photo-fond"
                fetchpriority="high"
            >


            <div class="degrade"></div>


            <!-- ========================================== -->
            <!-- PROFIL                                     -->
            <!-- ========================================== -->

            <div class="profil">

                <h1>
                    Bow
                </h1>


                <p class="pseudo">
                    @bowsiri_7997
                </p>


                <div class="followers">
                    My official accounts
                </div>


                <!-- ====================================== -->
                <!-- RÉSEAUX                                -->
                <!-- ====================================== -->

                <div class="reseaux">


                    <!-- INSTAGRAM -->

                    <button
                        class="icone bouton-reseau"
                        id="ouvrir-instagram"
                        type="button"
                        aria-label="Instagram"
                    >

                        <img
                            src="images/logos/instagram.webp"
                            alt="Instagram"
                        >

                    </button>


                    <!-- TIKTOK -->

                    <button
                        class="icone bouton-reseau"
                        id="ouvrir-tiktok"
                        type="button"
                        aria-label="TikTok"
                    >

                        <img
                            src="images/logos/tiktok.webp"
                            alt="TikTok"
                        >

                    </button>


                    <!-- FACEBOOK -->

                    <a
                        href="https://www.facebook.com/share/1AxxyMqYBf/"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Facebook"
                    >

                        <div class="icone">

                            <img
                                src="images/logos/facebook.webp"
                                alt="Facebook"
                            >

                        </div>

                    </a>

                </div>

            </div>

        </section>

    </main>



    <!-- ========================================== -->
    <!-- FENÊTRE INSTAGRAM                          -->
    <!-- ========================================== -->

    <dialog
        id="fenetre-instagram"
        class="fenetre-comptes"
    >

        <div class="contenu-fenetre">

            <button
                id="fermer-instagram"
                class="fermer"
                type="button"
                aria-label="Fermer"
            >
                ×
            </button>


            <img
                src="images/logos/instagram.webp"
                alt="Instagram"
                class="logo-fenetre"
            >


            <h2>
                Instagram
            </h2>


            <p class="question-compte">
                Quel compte voulez-vous voir ?
            </p>


            <!-- COMPTE INSTAGRAM 1 -->

            <a
                class="choix-compte"
                href="https://instagram.com/bowsiri_7997"
                target="_blank"
                rel="noopener noreferrer"
            >

                <span class="nom-compte">
                    @bowsiri_7997
                </span>

                <span class="description-compte">
                    Compte principal
                </span>

            </a>


            <!-- COMPTE INSTAGRAM 2 -->

            <a
                class="choix-compte"
                href="https://instagram.com/bow_797978"
                target="_blank"
                rel="noopener noreferrer"
            >

                <span class="nom-compte">
                    @bow_797978
                </span>

                <span class="description-compte">
                    Compte secondaire
                </span>

            </a>

        </div>

    </dialog>



    <!-- ========================================== -->
    <!-- FENÊTRE TIKTOK                             -->
    <!-- ========================================== -->

    <dialog
        id="fenetre-tiktok"
        class="fenetre-comptes"
    >

        <div class="contenu-fenetre">

            <button
                id="fermer-tiktok"
                class="fermer"
                type="button"
                aria-label="Fermer"
            >
                ×
            </button>


            <img
                src="images/logos/tiktok.webp"
                alt="TikTok"
                class="logo-fenetre"
            >


            <h2>
                TikTok
            </h2>


            <p class="question-compte">
                Quel compte voulez-vous voir ?
            </p>


            <!-- COMPTE TIKTOK 1 -->

            <a
                class="choix-compte"
                href="https://www.tiktok.com/@bowsiri79"
                target="_blank"
                rel="noopener noreferrer"
            >

                <span class="nom-compte">
                    @bowsiri79
                </span>

                <span class="description-compte">
                    Compte principal
                </span>

            </a>


            <!-- COMPTE TIKTOK 2 -->

            <a
                class="choix-compte"
                href="https://www.tiktok.com/@bowsiri7979"
                target="_blank"
                rel="noopener noreferrer"
            >

                <span class="nom-compte">
                    @bowsiri7979
                </span>

                <span class="description-compte">
                    Compte secondaire
                </span>

            </a>

        </div>

    </dialog>



    <!-- ========================================== -->
    <!-- JAVASCRIPT                                 -->
    <!-- ========================================== -->

    <script>

        window.addEventListener("load", () => {


            /* ====================================== */
            /* INSTAGRAM                              */
            /* ====================================== */

            const boutonInstagram =
                document.getElementById("ouvrir-instagram");

            const fenetreInstagram =
                document.getElementById("fenetre-instagram");

            const fermerInstagram =
                document.getElementById("fermer-instagram");


            boutonInstagram.addEventListener(
                "click",
                () => {

                    fenetreInstagram.showModal();

                }
            );


            fermerInstagram.addEventListener(
                "click",
                () => {

                    fenetreInstagram.close();

                }
            );


            fenetreInstagram.addEventListener(
                "click",
                (event) => {

                    if (event.target === fenetreInstagram) {

                        fenetreInstagram.close();

                    }

                }
            );



            /* ====================================== */
            /* TIKTOK                                 */
            /* ====================================== */

            const boutonTikTok =
                document.getElementById("ouvrir-tiktok");

            const fenetreTikTok =
                document.getElementById("fenetre-tiktok");

            const fermerTikTok =
                document.getElementById("fermer-tiktok");


            boutonTikTok.addEventListener(
                "click",
                () => {

                    fenetreTikTok.showModal();

                }
            );


            fermerTikTok.addEventListener(
                "click",
                () => {

                    fenetreTikTok.close();

                }
            );


            fenetreTikTok.addEventListener(
                "click",
                (event) => {

                    if (event.target === fenetreTikTok) {

                        fenetreTikTok.close();

                    }

                }
            );

        });

    </script>

</body>

</html>
