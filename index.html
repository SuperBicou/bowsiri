<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mes réseaux</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <section class="hero">

            <img
                src="images/photo_profil.webp"
                alt="Photo de profil"
                class="photo-fond"
            >

            <div class="degrade"></div>

            <div class="profil">

                <h1>Bow</h1>

                <p class="pseudo">
                    @bowsiri_7997
                </p>

                <div class="followers">
                    Mes comptes officiels
                </div>

                <div class="reseaux">

                    <!-- ============================== -->
                    <!-- INSTAGRAM                      -->
                    <!-- ============================== -->

                    <button
                        class="icone bouton-reseau"
                        id="ouvrir-instagram"
                        type="button"
                        aria-label="Instagram"
                    >
                        <img
                            src="images/logos/instagram.webp"
                            alt="Instagram"
                        >
                    </button>


                    <!-- ============================== -->
                    <!-- TIKTOK                         -->
                    <!-- ============================== -->

                    <button
                        class="icone bouton-reseau"
                        id="ouvrir-tiktok"
                        type="button"
                        aria-label="TikTok"
                    >
                        <img
                            src="images/logos/tiktok.webp"
                            alt="TikTok"
                        >
                    </button>


                    <!-- ============================== -->
                    <!-- FACEBOOK                       -->
                    <!-- ============================== -->

                    <a
                        href="https://www.facebook.com/share/1AxxyMqYBf/"
                        target="_blank"
                        rel="noopener noreferrer"
                    >

                        <div class="icone">

                            <img
                                src="images/logos/facebook.webp"
                                alt="Facebook"
                            >

                        </div>

                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- ========================================== -->
    <!-- FENÊTRE INSTAGRAM                          -->
    <!-- ========================================== -->

    <dialog
        id="fenetre-instagram"
        class="fenetre-comptes"
    >

        <div class="contenu-fenetre">

            <button
                id="fermer-instagram"
                class="fermer"
                type="button"
                aria-label="Fermer"
            >
                ×
            </button>


            <img
                src="images/logos/instagram.jpg"
                alt="Instagram"
                class="logo-fenetre"
            >


            <h2>
                Instagram
            </h2>


            <p class="question-compte">
                Quel compte voulez-vous voir ?
            </p>


            <!-- COMPTE INSTAGRAM 1 -->

            <a
                class="choix-compte"
                href="https://instagram.com/@bowsiri_7997"
                target="_blank"
                rel="noopener noreferrer"
            >

                <span class="nom-compte">
                    @bowsiri_7997
                </span>

                <span class="description-compte">
                    Compte principal
                </span>

            </a>


            <!-- COMPTE INSTAGRAM 2 -->

            <a
                class="choix-compte"
                href="https://instagram.com/@bow_797978"
                target="_blank"
                rel="noopener noreferrer"
            >

                <span class="nom-compte">
                    @bow_797978
                </span>

                <span class="description-compte">
                    Compte secondaire
                </span>

            </a>

        </div>

    </dialog>


    <!-- ========================================== -->
    <!-- FENÊTRE TIKTOK                             -->
    <!-- ========================================== -->

    <dialog
        id="fenetre-tiktok"
        class="fenetre-comptes"
    >

        <div class="contenu-fenetre">

            <button
                id="fermer-tiktok"
                class="fermer"
                type="button"
                aria-label="Fermer"
            >
                ×
            </button>


            <img
                src="images/logos/tiktok.jpg"
                alt="TikTok"
                class="logo-fenetre"
            >


            <h2>
                TikTok
            </h2>


            <p class="question-compte">
                Quel compte voulez-vous voir ?
            </p>


            <!-- COMPTE TIKTOK 1 -->

            <a
                class="choix-compte"
                href="https://www.tiktok.com/@bowsiri79"
                target="_blank"
                rel="noopener noreferrer"
            >

                <span class="nom-compte">
                    @bowsiri79
                </span>

                <span class="description-compte">
                    Compte principal
                </span>

            </a>


            <!-- COMPTE TIKTOK 2 -->

            <a
                class="choix-compte"
                href="https://www.tiktok.com/@bowsiri7979"
                target="_blank"
                rel="noopener noreferrer"
            >

                <span class="nom-compte">
                    @bowsiri7979
                </span>

                <span class="description-compte">
                    Compte secondaire
                </span>

            </a>

        </div>

    </dialog>


    <!-- ========================================== -->
    <!-- JAVASCRIPT                                 -->
    <!-- ========================================== -->

    <script>

        /* ============================== */
        /* INSTAGRAM                      */
        /* ============================== */

        const boutonInstagram =
            document.getElementById("ouvrir-instagram");

        const fenetreInstagram =
            document.getElementById("fenetre-instagram");

        const fermerInstagram =
            document.getElementById("fermer-instagram");


        boutonInstagram.addEventListener("click", function() {

            fenetreInstagram.showModal();

        });


        fermerInstagram.addEventListener("click", function() {

            fenetreInstagram.close();

        });


        fenetreInstagram.addEventListener("click", function(event) {

            if (event.target === fenetreInstagram) {

                fenetreInstagram.close();

            }

        });



        /* ============================== */
        /* TIKTOK                         */
        /* ============================== */

        const boutonTikTok =
            document.getElementById("ouvrir-tiktok");

        const fenetreTikTok =
            document.getElementById("fenetre-tiktok");

        const fermerTikTok =
            document.getElementById("fermer-tiktok");


        boutonTikTok.addEventListener("click", function() {

            fenetreTikTok.showModal();

        });


        fermerTikTok.addEventListener("click", function() {

            fenetreTikTok.close();

        });


        fenetreTikTok.addEventListener("click", function(event) {

            if (event.target === fenetreTikTok) {

                fenetreTikTok.close();

            }

        });

    </script>

</body>

</html>
