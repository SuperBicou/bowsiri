<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Social Media</title>

    <meta
        name="description"
        content="Bow's official social media accounts. Find her Instagram, TikTok and Facebook profiles here."
    >


    <!-- ========================================== -->
    <!-- PRELOAD MAIN PHOTO                         -->
    <!-- ========================================== -->

    <link
        rel="preload"
        as="image"
        href="images/photo_profil_2.webp"
        type="image/webp"
        fetchpriority="high"
    >


    <!-- ========================================== -->
    <!-- PRELOAD CSS                                -->
    <!-- ========================================== -->

    <link
        rel="preload"
        href="style.css"
        as="style"
    >


    <!-- ========================================== -->
    <!-- CRITICAL CSS                               -->
    <!-- ========================================== -->

    <style>

        * {
            box-sizing: border-box;
        }


        html {
            width: 100%;
            height: 100%;

            margin: 0;

            background-color: black;

            overflow: hidden;
        }


        body {
            margin: 0;

            width: 100%;

            height: 100vh;
            height: 100dvh;

            background-color: black;

            font-family: Arial, sans-serif;

            color: white;

            position: relative;

            overflow: hidden;

            overscroll-behavior: none;

            isolation: isolate;
        }


        body::before {
            content: "";

            position: fixed;

            top: -80px;
            right: -80px;
            bottom: -80px;
            left: -80px;

            background-image:
                url("images/photo_profil_2.webp");

            background-position: center;

            background-size: cover;

            background-repeat: no-repeat;

            filter:
                blur(70px)
                saturate(1.25);

            opacity: 0.75;

            transform: scale(1.1);

            z-index: 0;

            pointer-events: none;
        }


        body::after {
            content: "";

            position: fixed;

            inset: 0;

            background: linear-gradient(
                to right,

                rgba(0, 0, 0, 0.95) 0%,

                rgba(0, 0, 0, 0.55) 18%,

                rgba(0, 0, 0, 0.05) 36%,

                transparent 44%,

                transparent 56%,

                rgba(0, 0, 0, 0.05) 64%,

                rgba(0, 0, 0, 0.55) 82%,

                rgba(0, 0, 0, 0.95) 100%
            );

            z-index: 0;

            pointer-events: none;
        }


        .page {
            position: relative;

            z-index: 1;

            width: 100%;
            max-width: 500px;

            height: 100%;

            margin: auto;

            overflow: hidden;
        }


        .hero {
            position: relative;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background-color: black;
        }


        .photo-fond {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            z-index: 0;
        }


        .degrade {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            background: linear-gradient(
                to bottom,

                transparent 58%,

                rgba(0, 0, 0, 0.42) 68%,

                rgba(0, 0, 0, 0.60) 78%,

                rgba(0, 0, 0, 0.65) 90%,

                rgba(0, 0, 0, 0.85) 100%
            );

            z-index: 1;

            pointer-events: none;
        }


        .profil {
            position: absolute;

            bottom: 30px;

            width: 100%;

            padding: 20px;

            text-align: center;

            z-index: 2;
        }


        h1 {
            margin: 0;

            font-size: 42px;

            font-weight: bold;
        }


        .pseudo {
            margin: 10px 0;

            color: #cccccc;

            font-size: 25px;
        }


        .followers {
            display: inline-block;

            padding: 8px 15px;

            margin-bottom: 25px;

            border-radius: 20px;

            font-size: 16px;
        }


        .reseaux {
            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 18px;
        }


        .icone {
            width: 65px;
            height: 65px;

            border: 2px solid #444;

            border-radius: 50%;

            background-color: white;

            display: flex;

            justify-content: center;
            align-items: center;

            overflow: hidden;
        }


        .icone img {
            width: 50px;
            height: 50px;

            object-fit: contain;
        }

    </style>


    <!-- ========================================== -->
    <!-- FULL CSS                                   -->
    <!-- ========================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <main class="page">

        <section class="hero">


            <!-- ========================================== -->
            <!-- MAIN PHOTO                                 -->
            <!-- ========================================== -->

            <img
                src="images/photo_profil_2.webp"
                alt="Profile photo"
                class="photo-fond"
                loading="eager"
                fetchpriority="high"
                decoding="async"
            >


            <div class="degrade"></div>


            <!-- ========================================== -->
            <!-- PROFILE                                    -->
            <!-- ========================================== -->

            <div class="profil">

                <h1>
                    Bow
                </h1>


                <p class="pseudo">
                    @bowsiri_7997
                </p>


                <div class="followers">
                    My official accounts
                </div>


                <!-- ====================================== -->
                <!-- SOCIAL MEDIA                           -->
                <!-- ====================================== -->

                <div class="reseaux">


                    <!-- INSTAGRAM -->

                    <button
                        class="icone bouton-reseau"
                        id="ouvrir-instagram"
                        type="button"
                        aria-label="Open Instagram accounts"
                        aria-haspopup="dialog"
                        aria-controls="fenetre-instagram"
                    >

                        <img
                            src="images/logos/instagram.webp"
                            alt=""
                            width="50"
                            height="50"
                            decoding="async"
                            aria-hidden="true"
                        >

                    </button>


                    <!-- TIKTOK -->

                    <button
                        class="icone bouton-reseau"
                        id="ouvrir-tiktok"
                        type="button"
                        aria-label="Open TikTok accounts"
                        aria-haspopup="dialog"
                        aria-controls="fenetre-tiktok"
                    >

                        <img
                            src="images/logos/tiktok.webp"
                            alt=""
                            width="50"
                            height="50"
                            decoding="async"
                            aria-hidden="true"
                        >

                    </button>


                    <!-- FACEBOOK -->

                    <a
                        class="icone"
                        href="https://www.facebook.com/share/1AxxyMqYBf/"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Open Facebook profile"
                    >

                        <img
                            src="images/logos/facebook.webp"
                            alt=""
                            width="50"
                            height="50"
                            decoding="async"
                            aria-hidden="true"
                        >

                    </a>

                </div>

            </div>

        </section>

    </main>



    <!-- ========================================== -->
    <!-- INSTAGRAM ACCOUNT DIALOG                   -->
    <!-- ========================================== -->

    <dialog
        id="fenetre-instagram"
        class="fenetre-comptes"
        aria-labelledby="titre-instagram"
        aria-describedby="description-instagram"
    >

        <div class="contenu-fenetre">


            <button
                id="fermer-instagram"
                class="fermer"
                type="button"
                aria-label="Close Instagram accounts dialog"
            >
                ×
            </button>


            <img
                src="images/logos/instagram.webp"
                alt=""
                width="60"
                height="60"
                decoding="async"
                aria-hidden="true"
                class="logo-fenetre"
            >


            <h2 id="titre-instagram">
                Instagram
            </h2>


            <p
                class="question-compte"
                id="description-instagram"
            >
                Which account would you like to view?
            </p>


            <a
                class="choix-compte"
                href="https://instagram.com/bowsiri_7997"
                target="_blank"
                rel="noopener noreferrer"
            >

                <span class="nom-compte">
                    @bowsiri_7997
                </span>

                <span class="description-compte">
                    Main account
                </span>

            </a>


            <a
                class="choix-compte"
                href="https://instagram.com/bow_bow797978"
                target="_blank"
                rel="noopener noreferrer"
            >

                <span class="nom-compte">
                    @bow_bow797978
                </span>

                <span class="description-compte">
                    Secondary account
                </span>

            </a>

        </div>

    </dialog>



    <!-- ========================================== -->
    <!-- TIKTOK ACCOUNT DIALOG                      -->
    <!-- ========================================== -->

    <dialog
        id="fenetre-tiktok"
        class="fenetre-comptes"
        aria-labelledby="titre-tiktok"
        aria-describedby="description-tiktok"
    >

        <div class="contenu-fenetre">


            <button
                id="fermer-tiktok"
                class="fermer"
                type="button"
                aria-label="Close TikTok accounts dialog"
            >
                ×
            </button>


            <img
                src="images/logos/tiktok.webp"
                alt=""
                width="60"
                height="60"
                decoding="async"
                aria-hidden="true"
                class="logo-fenetre"
            >


            <h2 id="titre-tiktok">
                TikTok
            </h2>


            <p
                class="question-compte"
                id="description-tiktok"
            >
                Which account would you like to view?
            </p>


            <a
                class="choix-compte"
                href="https://www.tiktok.com/@bowsiri79"
                target="_blank"
                rel="noopener noreferrer"
            >

                <span class="nom-compte">
                    @bowsiri79
                </span>

                <span class="description-compte">
                    Main account
                </span>

            </a>


            <a
                class="choix-compte"
                href="https://www.tiktok.com/@bow7594"
                target="_blank"
                rel="noopener noreferrer"
            >

                <span class="nom-compte">
                    @bow7594
                </span>

                <span class="description-compte">
                    Secondary account
                </span>

            </a>

        </div>

    </dialog>



    <!-- ========================================== -->
    <!-- JAVASCRIPT                                 -->
    <!-- ========================================== -->

    <script
        src="script.js"
        defer
    ></script>


</body>

</html>
